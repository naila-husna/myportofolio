{% extends "base.html" %}

{% block meta %}
<title>Add Experience - {{ name }}</title>
{% endblock meta %}

{% block content %}
<main>
    <section class="experience-section">
        <div class="container">
            <h1>Add New Experience</h1>

            <form method="post" action="{% url 'main:create_experience' %}" class="experience-form">
                {% csrf_token %}

                {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% for error in field.errors %}
                    <p class="form-error">
                        {{ error }}
                    </p>
                    {% endfor %}
                </div>
                {% endfor %}

                <div class="form-actions">
                    <button type="submit" class="button">
                        Tambah Experience
                    </button>

                    <a href="{% url 'main:show_experience' %}" class="button button-secondary">
                        Batal
                    </a>
                </div>
            </form>
        </div>
    </section>
</main>
{% endblock content %}
