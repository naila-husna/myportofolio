<p class="experience-status">
    <button type="button" class="button button-danger" popovertarget="delete-message-{{ message.id }}">
        Delete
    </button>
</p>

<div id="delete-message-{{ message.id }}" class="project-delete-modal" popover="auto" role="dialog">
    <div class="project-delete-modal__content">

        <h2>Delete Message?</h2>

        <p>
            Are you sure you want to delete this message from
            <strong>{{ message.name }}</strong>?
        </p>

        <div class="project-delete-modal__actions">

            <button type="button" class="button button-secondary" popovertarget="delete-message-{{ message.id }}"
                popovertargetaction="hide">
                Cancel
            </button>

            <form method="POST" action="{% url 'main:delete_message' message.id %}">
                {% csrf_token %}

                <button type="submit" class="button button-danger">
                    Yes, Delete
                </button>
            </form>

        </div>
    </div>
</div>
